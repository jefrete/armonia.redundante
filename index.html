<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Armonizador Modal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#050505;
    --card:#0d0d0d;
    --border:#222;
    --text:#f1eee8;
    --muted:#777;
    --accent:#d6ff3f;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'DM Mono', monospace;
    min-height:100vh;
    overflow-x:hidden;
}

.app{
    max-width:600px;
    margin:auto;
    padding:18px 14px 30px;
}

header{
    text-align:center;
    margin-bottom:18px;
}

h1{
    font-family:'Playfair Display', serif;
    font-size:2rem;
    margin:0;
    letter-spacing:-1px;
}

.subtitle{
    color:var(--muted);
    font-size:.72rem;
    margin-top:5px;
    letter-spacing:1px;
    text-transform:uppercase;
}

/* SELECTOR */

.note-selector{
    background:#111;
    border:1px solid var(--border);
    border-radius:18px;
    padding:14px;
    margin-bottom:16px;
}

.selector-label{
    font-size:.65rem;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:10px;
}

.notes{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:7px;
}

.note-btn{
    border:1px solid #282828;
    background:#090909;
    color:#aaa;
    border-radius:10px;
    padding:9px 2px;
    font-size:.8rem;
    transition:.15s;
}

.note-btn:active{
    transform:scale(.95);
}

.note-btn.active{
    background:var(--accent);
    color:#050505;
    border-color:var(--accent);
    font-weight:bold;
}

/* CARDS */

.mode-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:11px 12px;
    margin-bottom:7px;
    transition:.2s;
}

.mode-card:hover{
    border-color:#444;
}

.mode-name{
    color:var(--accent);
    font-size:.68rem;
    letter-spacing:1px;
    margin-bottom:6px;
    font-weight:bold;
}

.chords{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

.chord{
    background:#151515;
    border:1px solid #252525;
    border-radius:6px;
    padding:4px 7px;
    font-size:.78rem;
    color:#e8e8e8;
}

footer{
    text-align:center;
    margin-top:18px;
    color:#444;
    font-size:.6rem;
}

</style>
</head>


<body>

<div class="app">

<header>
    <h1>Armonizador</h1>
    <div class="subtitle">Modos · Escalas · Armonía</div>
</header>


<div class="note-selector">

    <div class="selector-label">
        Elegí la nota raíz
    </div>

    <div class="notes" id="notes"></div>

</div>


<div id="harmonies"></div>


<footer>
    La música es matemática que decidió tener sentimientos.
</footer>

</div>


<script>

/* ==========================================
   NOTAS
========================================== */

const notes = [
    "C","C#","D","Eb","E","F",
    "F#","G","Ab","A","Bb","B"
];


/* ==========================================
   ESTRUCTURAS ARMÓNICAS

   Cada número representa semitonos desde
   la nota raíz.

========================================== */

const modes = [

{
    name:"JÓNICO",
    intervals:[0,2,4,5,7,9,11],
    qualities:["","m","m","","","m","dim"]
},

{
    name:"DÓRICO",
    intervals:[0,2,3,5,7,9,10],
    qualities:["m","m","","","m","dim",""]
},

{
    name:"FRIGIO",
    intervals:[0,1,3,5,7,8,10],
    qualities:["m","","","m","dim","","m"]
},

{
    name:"LIDIO",
    intervals:[0,2,4,6,7,9,11],
    qualities:["","","m","dim","","m","m"]
},

{
    name:"MIXOLIDIO",
    intervals:[0,2,4,5,7,9,10],
    qualities:["","m","dim","","m","m",""]
},

{
    name:"EÓLICO",
    intervals:[0,2,3,5,7,8,10],
    qualities:["m","dim","","m","m","",""]
},

{
    name:"LOCRIO",
    intervals:[0,1,3,5,6,8,10],
    qualities:["dim","","m","m","","","m"]
},

{
    name:"MENOR ARM.",
    intervals:[0,2,3,5,7,8,11],
    qualities:["m","dim","+","m","","","dim"]
},

{
    name:"MENOR MEL.",
    intervals:[0,2,3,5,7,9,11],
    qualities:["m","m","+","","","m","dim"]
}

];


/* ==========================================
   ESTADO
========================================== */

let root = "C";


/* ==========================================
   OBTENER NOTA
========================================== */

function getNote(rootNote, semitones){

    const index = notes.indexOf(rootNote);

    return notes[
        (index + semitones) % 12
    ];

}


/* ==========================================
   RENDER BOTONES
========================================== */

function renderNotes(){

    const container =
        document.getElementById("notes");

    container.innerHTML = "";

    notes.forEach(note => {

        const btn =
            document.createElement("button");

        btn.className =
            "note-btn" +
            (note === root ? " active" : "");

        btn.innerText = note;

        btn.onclick = () => {

            root = note;

            renderNotes();
            renderHarmonies();

        };

        container.appendChild(btn);

    });

}


/* ==========================================
   RENDER ARMONÍAS
========================================== */

function renderHarmonies(){

    const container =
        document.getElementById("harmonies");

    container.innerHTML = "";

    modes.forEach(mode => {

        const card =
            document.createElement("div");

        card.className = "mode-card";


        const name =
            document.createElement("div");

        name.className = "mode-name";

        name.innerText =
            root + " " + mode.name;


        const chords =
            document.createElement("div");

        chords.className = "chords";


        mode.intervals.forEach(
            (interval, i) => {

                const note =
                    getNote(root, interval);

                const quality =
                    mode.qualities[i];

                const chord =
                    document.createElement("span");

                chord.className = "chord";

                chord.innerText =
                    note + quality;

                chords.appendChild(chord);

            }
        );


        card.appendChild(name);
        card.appendChild(chords);

        container.appendChild(card);

    });

}


/* ==========================================
   INICIAR
========================================== */

renderNotes();
renderHarmonies();

</script>

</body>
</html>
