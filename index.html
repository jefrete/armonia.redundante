<body>

<div class="app">

<header>

    <h1>Armonizador</h1>

    <div class="subtitle">
        Modos · Escalas · Armonía · Progresiones
    </div>

</header>


<!-- ================================
     RAÍZ
================================ -->

<div class="note-selector">

    <div class="selector-label">
        Elegí la nota raíz
    </div>

    <div class="notes" id="notes"></div>

</div>


<!-- ================================
     MODOS

<div class="section">

    <div class="section-title">

        <strong>

        </strong>

        <span>

        </span>

    </div>

    <div id="harmonies"></div>

</div>


<!-- ================================
     REDUCCIÓN

<div class="section">

    <div class="section-title">

        <strong>
            REDUCCIÓN ARMÓNICA
        </strong>

        <span>
            <span class="counter" id="reductionCount">0</span>
            acordes únicos
        </span>

    </div>

        class="reduction"

    </div>

</div>


<!-- ================================
     PROGRESIÓN
================================ -->

<div class="section">

    <div class="section-title">

        <strong>
            PROGRESIÓN
        </strong>

        <span>
            agregá / eliminá
        </span>

    </div>


    <div
        id="progression"
        class="progression empty">

        Generá una progresión o agregá acordes ↓

    </div>


    <div class="controls">

        <button
            class="control primary"
            onclick="randomProgression()">

            🎲 PROGRESIÓN RANDOM

        </button>


        <button
            class="control"
            onclick="playProgression()">

            ▶ REPRODUCIR

        </button>


        <button
            class="control"

            ■ STOP

        </button>

        </button>

<footer>

<script>

/* ==================================================
   NOTAS
================================================== */

const notes = [
    "C","C#","D","Eb","E","F",
    "F#","G","Ab","A","Bb","B"
];


/* ==================================================
   MODOS

   intervalos = semitonos

   qualities:
   ""     mayor
   "m"    menor
   "dim"  disminuido
   "+"    aumentado

================================================== */

const modes = [

{
    name:"JÓNICO",
    intervals:[0,2,4,5,7,9,11],
    qualities:["","m","m","","","m","dim"]
},

{
    name:"DÓRICO",
    intervals:[0,2,3,5,7,9,10],
    qualities:["m","m","","","m","dim",""]
},

{
    name:"FRIGIO",
    intervals:[0,1,3,5,7,8,10],
    qualities:["m","","","m","dim","","m"]
},

{
    name:"LIDIO",
    intervals:[0,2,4,6,7,9,11],
    qualities:["","","m","dim","","m","m"]
},

{
    name:"MIXOLIDIO",
    intervals:[0,2,4,5,7,9,10],
    qualities:["","m","dim","","m","m",""]
},

{
    name:"EÓLICO",
    intervals:[0,2,3,5,7,8,10],
    qualities:["m","dim","","m","m","",""]
},

{
    name:"LOCRIO",
    intervals:[0,1,3,5,6,8,10],
    qualities:["dim","","m","m","","","m"]
},

{
    name:"MENOR ARM.",
    intervals:[0,2,3,5,7,8,11],
    qualities:["m","dim","+","m","","","dim"]
},

{
    name:"MENOR MEL.",
    intervals:[0,2,3,5,7,9,11],
    qualities:["m","m","+","","","m","dim"]
}

];


/* ==================================================
   ESTADO
================================================== */

let root = "C";

let reducedChords = [];

let progression = [];

let audioContext = null;

let activeOscillators = [];


/* ==================================================
   OBTENER NOTA
================================================== */

function getNote(rootNote,semitones){

    const index = notes.indexOf(rootNote);

    return notes[
        (index + semitones) % 12
    ];

}


/* ==================================================
   CONVERTIR ACORDE A NOTAS

   Sirve para que el WebAudio pueda tocarlo.

================================================== */

function chordIntervals(quality){

    if(quality === "m"){
        return [0,3,7];
    }

    if(quality === "dim"){
        return [0,3,6];
    }

    if(quality === "+"){
        return [0,4,8];
    }

    return [0,4,7];

}


/* ==================================================
   FRECUENCIA

   C4 = 261.63 Hz

================================================== */

function frequencyFromNote(note){

    const index = notes.indexOf(note);

    const cIndex = notes.indexOf("C");

    let semitones = index - cIndex;

    if(semitones < 0){
        semitones += 12;
    }

    return 261.63 * Math.pow(2,semitones/12);

}


/* ==================================================
   TOCAR ACORDE
================================================== */

function playChord(chordData){

    if(!audioContext){

        audioContext =
            new(window.AudioContext ||
            window.webkitAudioContext)();

    }

    stopChord();

    const intervals =
        chordIntervals(chordData.quality);

    const rootIndex =
        notes.indexOf(chordData.note);

    intervals.forEach(interval => {

        let noteIndex =
            (rootIndex + interval) % 12;

        let note =
            notes[noteIndex];

        let frequency =
            frequencyFromNote(note);

        /*
            Algunas notas deben sonar
            una octava arriba para que
            el acorde tenga más cuerpo.
        */

        let octave = 1;

        if(interval >= 7){
            octave = 2;
        }

        frequency *= octave;


        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type = "triangle";

        oscillator.frequency.value =
            frequency;


        const now =
            audioContext.currentTime;


        gain.gain.setValueAtTime(
            0,
            now
        );

        gain.gain.linearRampToValueAtTime(
            0.18,
            now + 0.03
        );

        gain.gain.linearRampToValueAtTime(
            0.10,
            now + 0.35
        );


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start();

        activeOscillators.push({
            oscillator,
            gain
        });

    });

}


/* ==================================================
   DETENER ACORDE
================================================== */

function stopChord(){

    if(!audioContext){
        return;
    }

    const now =
        audioContext.currentTime;

    activeOscillators.forEach(item => {

        item.gain.gain.cancelScheduledValues(now);

        item.gain.gain.setValueAtTime(
            item.gain.gain.value,
            now
        );

        item.gain.gain.exponentialRampToValueAtTime(
            0.001,
            now + 0.15
        );

        item.oscillator.stop(
            now + 0.17
        );

    });

    activeOscillators = [];

}


/* ==================================================
   BOTONES DE NOTAS
================================================== */

function renderNotes(){

    const container =
        document.getElementById("notes");

    container.innerHTML = "";


    notes.forEach(note => {

        const btn =
            document.createElement("button");

        btn.className =
            "note-btn" +
            (note === root ? " active" : "");

        btn.innerText = note;


        btn.onclick = () => {

            root = note;

            progression = [];

            renderNotes();

            renderHarmonies();

            buildReduction();

            renderProgression();

        };


        container.appendChild(btn);

    });

}


/* ==================================================
   RENDER MODOS
================================================== */

function renderHarmonies(){

    const container =
        document.getElementById("harmonies");

    container.innerHTML = "";


    modes.forEach(mode => {

        const card =
            document.createElement("div");

        card.className =
            "mode-card";


        const name =
            document.createElement("div");

        name.className =
            "mode-name";

        name.innerText =
            root + " " + mode.name;


        const chords =
            document.createElement("div");

        chords.className =
            "chords";


        mode.intervals.forEach(
            (interval,i) => {

                const note =
                    getNote(
                        root,
                        interval
                    );

                const quality =
                    mode.qualities[i];


                const chord =
                    document.createElement("span");

                chord.className =
                    "chord";

                chord.innerText =
                    note + quality;


                chord.onclick = () => {

                    playChord({
                        note:note,
                        quality:quality
                    });

                };


                chords.appendChild(chord);

            }
        );


        card.appendChild(name);

        card.appendChild(chords);

        container.appendChild(card);

    });

}


/* ==================================================
   CREAR REDUCCIÓN

   Acá está el corazón del sistema.

   Set() elimina automáticamente
   los acordes repetidos.

================================================== */

function buildReduction(){

    const unique =
        new Map();


    modes.forEach(mode => {

        mode.intervals.forEach(
            (interval,i) => {

                const note =
                    getNote(
                        root,
                        interval
                    );

                const quality =
                    mode.qualities[i];


                const id =
                    note + quality;


                /*
                    Si todavía no existe,
                    lo guardamos.

                    Si ya apareció,
                    NO se agrega nuevamente.
                */

                if(!unique.has(id)){

                    unique.set(id,{
                        id:id,
                        note:note,
                        quality:quality
                    });

                }

            }
        );

    });


    reducedChords =
        Array.from(unique.values());


    renderReduction();

}


/* ==================================================
   RENDER REDUCCIÓN
================================================== */

function renderReduction(){

    const container =
        document.getElementById("reduction");

    container.innerHTML = "";


    document.getElementById(
        "reductionCount"
    ).innerText =
        reducedChords.length;


    reducedChords.forEach(chord => {

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "reduced-chord";


        const name =
            document.createElement("div");

        name.className =
            "reduced-name";

        name.innerText =
            chord.id;


        /*
            Tocamos el acorde
            al hacer click.
        */

        name.onclick = () => {

            playChord(chord);

        };


        const add =
            document.createElement("button");

        add.className =
            "add-mini";

        add.innerText =
            "+";


        /*
            Agrega el acorde
            a la progresión.
        */

        add.onclick = () => {

            addToProgression(chord);

        };


        wrapper.appendChild(name);

        wrapper.appendChild(add);

        container.appendChild(wrapper);

    });

}


/* ==================================================
   AGREGAR A PROGRESIÓN
================================================== */

function addToProgression(chord){

    progression.push(chord);

    renderProgression();

}


/* ==================================================
   BORRAR ACORDE DE PROGRESIÓN
================================================== */

function removeFromProgression(index){

    progression.splice(index,1);

    renderProgression();

}


/* ==================================================
   RENDER PROGRESIÓN
================================================== */

function renderProgression(){

    const container =
        document.getElementById("progression");


    container.innerHTML = "";


    if(progression.length === 0){

        container.classList.add("empty");

        container.innerText =
            "Generá una progresión o agregá acordes ↓";

        return;

    }


    container.classList.remove("empty");


    progression.forEach(
        (chord,index) => {

            const wrapper =
                document.createElement("div");

            wrapper.className =
                "progression-chord";


            const name =
                document.createElement("div");

            name.className =
                "progression-name";

            name.innerText =
                chord.id;


            /*
                Tocar un acorde individual.
            */

            name.onclick = () => {

                playChord(chord);

            };


            const remove =
                document.createElement("button");

            remove.className =
                "delete-chord";

            remove.innerText =
                "×";


            remove.onclick = () => {

                removeFromProgression(index);

            };


            wrapper.appendChild(name);

            wrapper.appendChild(remove);

            container.appendChild(wrapper);

        }
    );

}


/* ==================================================
   PROGRESIÓN RANDOM
================================================== */

function randomProgression(){

    stopProgression();


    if(reducedChords.length === 0){
        return;
    }


    /*
        Elegimos entre 3 y 5 acordes.

        Se pueden repetir algunos,
        porque una progresión musical
        puede perfectamente repetir
        un acorde.
    */

    const length =
        Math.floor(
            Math.random() * 3
        ) + 3;


    progression = [];


    for(let i=0;i<length;i++){

        const randomIndex =
            Math.floor(
                Math.random() *
                reducedChords.length
            );


        progression.push(
            reducedChords[randomIndex]
        );

    }


    renderProgression();

}


/* ==================================================
   REPRODUCIR PROGRESIÓN
================================================== */

let progressionTimer = null;

let progressionPosition = 0;


function playProgression(){

    stopProgression();


    if(progression.length === 0){
        return;
    }


    progressionPosition = 0;


    function nextChord(){

        if(
            progressionPosition >=
            progression.length
        ){

            progressionPosition = 0;

            return;

        }


        const chord =
            progression[
                progressionPosition
            ];


        playChord(chord);


        progressionPosition++;


        progressionTimer =
            setTimeout(
                nextChord,
                1000
            );

    }


    nextChord();

}


/* ==================================================
   STOP PROGRESIÓN
================================================== */

function stopProgression(){

    if(progressionTimer){

        clearTimeout(
            progressionTimer
        );

        progressionTimer = null;

    }

    stopChord();

}


/* ==================================================
   BORRAR TODO
================================================== */

function clearProgression(){

    stopProgression();

    progression = [];

    renderProgression();

}


/* ==================================================
   INICIAR
================================================== */

renderNotes();

renderHarmonies();

buildReduction();

renderProgression();

</script>

</body>
</html>
```
